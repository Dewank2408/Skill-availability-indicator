<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Campus Connect</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Campus Connect</h1>
                <p>Login to connect with your peers</p>
            </div>
            
            <form class="auth-form" id="loginForm">
                <div class="form-group">
                    <label for="email">College Email</label>
                    <input type="email" id="email" name="email" placeholder="yourname@college.edu" required>
                    <small class="form-hint">Use your institutional email address</small>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">Remember me</label>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block">Login</button>
                
                <div class="form-divider">
                    <span>OR</span>
                </div>
                
                <a href="signup.html" class="btn btn-secondary btn-block">Create New Account</a>
                
                <div class="form-links">
                    <a href="#" id="forgotPassword">Forgot Password?</a>
                </div>
            </form>
            
            <div id="authMessage" class="auth-message"></div>
        </div>
        
        <div class="auth-footer">
            <a href="index.html">← Back to Home</a>
        </div>
    </div>
    
    <script src="js/auth.js"></script>
</body>
</html>
